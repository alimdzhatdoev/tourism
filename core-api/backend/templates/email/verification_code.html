<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Авторизация в приложении VISITKCHR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap');
      /**
   * Avoid browser level font resizing.
   * 1. Windows Mobile
   * 2. iOS / OSX
   */
      body,
      table,
      td,
      a {
        -ms-text-size-adjust: 100%; /* 1 */
        -webkit-text-size-adjust: 100%; /* 2 */
      }

      /**
   * Remove extra space added to tables and cells in Outlook.
   */
      table,
      td {
        mso-table-rspace: 0pt;
        mso-table-lspace: 0pt;
      }

      /**
   * Better fluid images in Internet Explorer.
   */
      img {
        -ms-interpolation-mode: bicubic;
      }

      /**
   * Remove blue links for iOS devices.
   */
      a[x-apple-data-detectors] {
        font-family: inherit !important;
        font-size: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
        color: inherit !important;
        text-decoration: none !important;
      }

      /**
   * Fix centering issues in Android 4.4.
   */
      div[style*='margin: 16px 0;'] {
        margin: 0 !important;
      }

      body {
        width: 100% !important;
        height: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      /**
   * Collapse table borders to avoid space between cells.
   */
      table {
        border-collapse: collapse !important;
      }
    </style>
  </head>
  <body>
    <!-- start body -->
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center" bgcolor="#f5f5f7" style="padding: 70px 0">
          <!--[if (gte mso 9)|(IE)]>
          <table align="center" border="0" cellpadding="0" cellspacing="0" width="390">
            <tr>
              <td align="center" valign="top" width="390">
          <![endif]-->
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="max-width: 390px; border: 1px solid #f5f5f5"
          >
            <tr>
              <td
                align="center"
                bgcolor="#ffffff"
                style="
                  padding: 60px 35px 30px;
                  font-family: 'Roboto', sans-serif;
                  border-top-left-radius: 42px;
                  border-top-right-radius: 42px;
                "
              >
                <h1
                  style="
                    margin: 0;
                    font-size: 24px;
                    font-weight: 500;
                    line-height: 33.6px;
                  "
                >
                  Авторизация в приложении VISITKCHR
                </h1>
              </td>
            </tr>
            <tr>
              <td
                align="center"
                bgcolor="#ffffff"
                style="
                  padding: 30px 0 0;
                  font-family: 'Roboto', sans-serif;
                  font-size: 16px;
                  font-weight: 400;
                  line-height: 22.4px;
                "
              >
                <p style="margin: 0">Ваш код подтверждения</p>
              </td>
            </tr>
            <tr>
              <td
                align="center"
                bgcolor="#ffffff"
                style="
                  padding: 10px 0 60px;
                  font-family: 'Roboto', sans-serif;
                  font-size: 32px;
                  font-weight: 500;
                  line-height: 41.6px;
                  letter-spacing: 10%;
                  color: #5191fa;
                "
              >
                <p style="margin: 0"><u>{{ access_code }}</u></p>
              </td>
            </tr>
            <tr>
              <td
                align="center"
                bgcolor="#ffffff"
                style="
                  padding: 30px 32px 30px;
                  font-family: 'Roboto', sans-serif;
                  font-size: 14px;
                  font-weight: 400;
                  line-height: 19.6px;
                  color: #a3b1bf;
                  border-top: 1px solid #f5f5f5;
                  border-bottom-left-radius: 42px;
                  border-bottom-right-radius: 42px;
                "
              >
                <p style="margin: 0">
                  Если вы не запрашивали это письмо, ничего страшного — просто
                  не обращайте на него внимания.
                </p>
              </td>
            </tr>
          </table>
          <!--[if (gte mso 9)|(IE)]>
              </td>
            </tr>
          </table>
          <![endif]-->
        </td>
      </tr>
    </table>
    <!-- end body -->
  </body>
</html>
