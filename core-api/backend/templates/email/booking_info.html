<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>VISITKCHR. {{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap');
      /**
   * Avoid browser level font resizing.
   * 1. Windows Mobile
   * 2. iOS / OSX
   */
      body,
      table,
      td,
      a {
        -ms-text-size-adjust: 100%; /* 1 */
        -webkit-text-size-adjust: 100%; /* 2 */
      }

      /**
   * Remove extra space added to tables and cells in Outlook.
   */
      table,
      td {
        mso-table-rspace: 0pt;
        mso-table-lspace: 0pt;
      }

      /**
   * Better fluid images in Internet Explorer.
   */
      img {
        -ms-interpolation-mode: bicubic;
      }

      /**
   * Remove blue links for iOS devices.
   */
      a[x-apple-data-detectors] {
        font-family: inherit !important;
        font-size: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
        color: inherit !important;
        text-decoration: none !important;
      }

      /**
   * Fix centering issues in Android 4.4.
   */
      div[style*='margin: 16px 0;'] {
        margin: 0 !important;
      }

      body {
        width: 100% !important;
        height: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      /**
   * Collapse table borders to avoid space between cells.
   */
      table {
        border-collapse: collapse !important;
      }
    </style>
  </head>
  <body>
    <!-- start body -->
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center" bgcolor="#f5f5f7" style="padding: 70px 0">
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="max-width: 390px; border: 1px solid #f5f5f5"
          >
            <tr>
              <td
                align="center"
                bgcolor="#ffffff"
                style="
                  padding: 60px 35px 30px;
                  font-family: 'Roboto', sans-serif;
                  border-top-left-radius: 42px;
                  border-top-right-radius: 42px;
                "
              >
                <h1
                  style="
                    margin: 0;
                    font-size: 24px;
                    font-weight: 500;
                    line-height: 33.6px;
                  "
                >
                  {{ title }}
                </h1>
              </td>
            </tr>
            <tr>
              <td
                align="center"
                bgcolor="#ffffff"
                style="
                  padding: 10px 0 60px;
                  font-family: 'Roboto', sans-serif;
                  font-size: 20px;
                  border-bottom-left-radius: 42px;
                  border-bottom-right-radius: 42px;
                "
              >
                <p style="margin: 0"><b>{{ type }}:</b> {{ name }}</p>
                <p style="margin: 0"><b>Адрес:</b> {{ address }}</p>
                <p style="margin: 0"><b>Дата и время:</b> {{ date }} в {{ time }}</p>
                <p style="margin: 0"><b>Количество человек:</b> {{ visitors }}</p>
                <p style="margin: 0"><b>ФИО:</b> {{ user_full_name }}</p>
                <p style="margin: 0"><b>Телефон:</b> {{ phone }}</p>
                <p style="margin: 0"><b>Почта:</b> {{ email }}</p>
                <p style="margin: 0"><b>Стоимость:</b> {{ total_price }}</p>
                <p style="margin: 0"><b>Тип оплаты:</b> {{ payment_kind }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
    <!-- end body -->
  </body>
</html>
